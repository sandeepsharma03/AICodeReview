name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

env:
  COPILOT_PAT: ${{ secrets.COPILOT_TOKEN_PAT }}
  GITHUB_API_URL: "https://github.com/api/v3"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt
      
      - name: Setup Node.js for Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install GitHub Copilot CLI
        run: |
          # Install the new standalone Copilot CLI via npm
          npm install -g @github/copilot
          
          # Verify installation
          copilot --version || echo "⚠️ Copilot CLI not available, will use fallback mode"
        continue-on-error: true
      
      - name: Run AI Code Review
        env:
          GHE_TOKEN: ${{ secrets.GIT_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .github/scripts/ai_code_reviewer.py
      
      - name: Post Review Summary
        if: always()
        run: |
          echo "AI Code Review completed"
          if [ -f .github/scripts/review_summary.txt ]; then
            cat .github/scripts/review_summary.txt
          fi
